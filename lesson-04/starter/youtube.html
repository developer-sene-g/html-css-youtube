<!DOCTYPE html>
<html>
  <head>
    <title>YouTube.com Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/youtube.css">
  </head>
  <body>
    <header class="header">
      <div class="left-section">
        <img class="youtube-logo" src="icons/youtube-logo.svg" alt="YouTube">
      </div>

      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search">
        <button class="search-button" type="button">
          <img class="search-icon" src="icons/search.svg" alt="Search">
        </button>
        <button class="voice-search-button" type="button">
          <img class="voice-search-icon" src="icons/voice-search-icon.svg" alt="Voice search">
        </button>
      </div>

      <div class="right-section">
        <img class="current-user-picture" src="channel-pictures/my-channel.jpeg" alt="Your channel">
      </div>
    </header>

    <div class="video-grid">
      <div class="video-preview">
        <div class="thumbnail-row">
          <img class="thumbnail" src="thumbnails/thumbnail-1.webp" alt="Talking Tech and AI with Google CEO Sundar Pichai!">
        </div>
        <div class="video-info-grid">
          <div class="channel-picture">
            <img class="profile-picture" src="channel-pictures/channel-1.jpeg" alt="Marques Brownlee">
          </div>
          <div class="video-info">
            <p class="video-title">
              Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
            <p class="video-author">
              Marques Brownlee
            </p>
            <p class="video-stats">
              3.4M views &#183; 6 months ago
            </p>
          </div>
        </div>
      </div>

      <div class="video-preview">
        <div class="thumbnail-row">
          <img class="thumbnail" src="thumbnails/thumbnail-2.webp" alt="Try Not To Laugh Challenge #9">
        </div>
        <div class="video-info-grid">
          <div class="channel-picture">
            <img class="profile-picture" src="channel-pictures/channel-2.jpeg" alt="Markiplier">
          </div>
          <div class="video-info">
            <p class="video-title">
              Try Not To Laugh Challenge #9
            </p>
            <p class="video-author">
              Markiplier
            </p>
            <p class="video-stats">
              19M views &#183; 4 years ago
            </p>
          </div>
        </div>
      </div>

      <!--
        動画を4本足して、全部で6本にする。
        1本目の video-preview をコピーして、番号と文字を変える。
        サムネイルは thumbnails/thumbnail-3.webp から thumbnail-6.webp、
        アバターは channel-pictures/channel-3.jpeg から channel-6.jpeg。

        3本目  Crazy Tik Toks Taken Moments Before DISASTER
               SSSniperWolf
               12M views &#183; 1 year ago

        4本目  The Simplest Math Problem No One Can Solve - Collatz Conjecture
               Veritasium
               18M views &#183; 4 months ago

        5本目  Kadane's Algorithm to Maximum Sum Subarray Problem
               CS Dojo
               519K views &#183; 5 years ago

        6本目  Anything You Can Fit In The Circle I'll Pay For
               MrBeast
               141M views &#183; 1 year ago

        まず HTML だけ書いてブラウザで見る。カードが今までどおり横に流れ、
        画面の幅によって折り返す位置が変わる。次に CSS で、きれいな3列にする。
      -->
    </div>
  </body>
</html>
